# Build all services:
# docker compose build

# Run all services:
# docker compose up

# Stop and remove all services:
# docker compose down

services:

  tests:
    build:
      context: .

    command: pytest -v


  open_loop:
    build:
      context: .

    volumes:
      - ./plots:/app/plots

    command: python src/ml_pid_tuning/simulations/open_loop.py

    depends_on:
      tests:
        condition: service_completed_successfully


  close_loop:
    build:
      context: .

    volumes:
      - ./plots:/app/plots

    command: python src/ml_pid_tuning/simulations/close_loop.py

    depends_on:
      open_loop:
        condition: service_completed_successfully


  generate_first_order_data:
    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/data/generate_first_order_dataset.py

    depends_on:
      close_loop:
        condition: service_completed_successfully


  generate_second_order_data:
    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/data/generate_second_order_dataset.py

    depends_on:
      close_loop:
        condition: service_completed_successfully


  train_first_order_model:
    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/ml/train_first_order.py

    depends_on:
      generate_first_order_data:
        condition: service_completed_successfully
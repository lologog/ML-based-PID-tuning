# Build all services:
# docker compose build

# Run all services:
# docker compose up

# Stop and remove all services:
# docker compose down

services:

  tests:
    build:
      context: .

    command: pytest -v


  open_loop:
    build:
      context: .

    volumes:
      - ./plots:/app/plots
      - ./src/ml_pid_tuning/simulations/data:/app/src/ml_pid_tuning/simulations/data

    command: python src/ml_pid_tuning/simulations/open_loop.py

    depends_on:
      tests:
        condition: service_completed_successfully


  close_loop:
    build:
      context: .

    volumes:
      - ./plots:/app/plots
      - ./src/ml_pid_tuning/simulations/data:/app/src/ml_pid_tuning/simulations/data

    command: python src/ml_pid_tuning/simulations/close_loop.py

    depends_on:
      open_loop:
        condition: service_completed_successfully


  generate_first_order_data:
    profiles: ["first_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/data/generate_first_order_dataset.py

    depends_on:
      close_loop:
        condition: service_completed_successfully


  generate_second_order_data:
    profiles: ["second_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/data/generate_second_order_dataset.py

    depends_on:
      close_loop:
        condition: service_completed_successfully


  generate_integrating_first_order_data:
    profiles: ["integrating_first_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/data/generate_integrating_first_order_dataset.py

    depends_on:
      close_loop:
        condition: service_completed_successfully


  train_first_order:
    profiles: ["first_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/ml/first_order/random_forest_regressor/train_first_order.py

    depends_on:
      generate_first_order_data:
        condition: service_completed_successfully


  train_second_order:
    profiles: ["second_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: python src/ml_pid_tuning/ml/second_order/random_forest_regressor/train_second_order.py

    depends_on:
      generate_second_order_data:
        condition: service_completed_successfully

  
  train_integrating_first_order:
    profiles: ["integrating_first_order"]

    build:
      context: .

    volumes:
      - ./src/ml_pid_tuning/data/datasets:/app/src/ml_pid_tuning/data/datasets

    command: >
      sh -c "
      python src/ml_pid_tuning/ml/integrating_first_order/random_forest_regressor/train_integrating_first_order.py &&
      python src/ml_pid_tuning/ml/integrating_first_order/extra_trees_regressor/train_integrating_first_order.py &&
      python src/ml_pid_tuning/ml/integrating_first_order/gradient_boosting_regressor/train_integrating_first_order.py &&
      python src/ml_pid_tuning/ml/integrating_first_order/mlp_regressor/train_integrating_first_order.py
      "

    depends_on:
      generate_integrating_first_order_data:
        condition: service_completed_successfully